cv:
  name: Jingoo Lee
  label: Ph.D. Candidate, Civil, Urban, Earth, and Environmental Engineering, UNIST
  email: jingoolee@unist.ac.kr · jingoo0223@gmail.com
  location: Ulsan, Republic of Korea
  image: ""
  summary: >-
    **Trustworthy Scientific AI for Safety-Critical Structures.**
    (1) *Physically interpretable deep learning:* 1D CNN kernels (FIR filters) linked to structural transfer functions, yielding a physics-based kernel-size design rule (Nuclear Engineering and Design, 2026; SMiRT-28 Heki Shibata Early Career Award, Honorable Mention).
    (2) *Neural operators across physics:* seismic structural dynamics with a Windowed Recurrent Fourier Neural Operator (WR-FNO) and electromagnetic NDT with an FNO for eddy-current flaw characterization in steam generator tubes, in international collaboration with CEA List (France) and KRISS (Korea).
    (3) *Virtual sensing and uncertainty for NPP seismic safety:* floor responses at 139 locations from a single seismometer, time-series uncertainty propagation, and inspection prioritization (CACAIE, 2025; RESS, 2026).

