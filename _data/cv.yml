cv:
  name: Jingoo Lee
  label: Ph.D. Candidate, Civil, Urban, Earth, and Environmental Engineering, UNIST
  email: jingoolee@unist.ac.kr · jingoo0223@gmail.com
  location: Ulsan, Republic of Korea
  image: ""
  summary: >-
    **Trustworthy Scientific AI for Safety-Critical Structures.**
    (1) *Physically interpretable deep learning:* 1D CNN kernels (FIR filters) linked to structural transfer functions, yielding a physics-based kernel-size rule K̂ = 1895 / f<sub>n</sub> (Nuclear Engineering and Design, 2026; SMiRT-28 Heki Shibata Early Career Award, Honorable Mention).
    (2) *Beyond the linear regime:* extended the framework to nonlinear hysteretic response under beyond-design-basis shaking — a kinematics-aware loss cut the mean error of a GRU model by 53% (mMAPE 1.00% → 0.47%, Bouc–Wen, at the training intensity), at ~3.4 ms per record on a GPU (≈55–1,100× faster than nonlinear time-history analysis). Operator-learning extensions — a Windowed Recurrent FNO (KNS 2026) and an FNO for eddy-current NDT with CEA List & KRISS — are in preparation.
    (3) *Virtual sensing and uncertainty for NPP seismic safety:* floor responses at 139 locations from a single seismometer (1 → 139), probabilistic prediction under structural uncertainty about 10<sup>5</sup>× faster than 100 Monte Carlo FE runs (35 h → <1 s), and inspection prioritization (Computer-Aided Civil and Infrastructure Engineering, 2025; Reliability Engineering & System Safety, 2026).

